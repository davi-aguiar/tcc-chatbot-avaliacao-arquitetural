name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      # app/requirements.txt fica de fora: torch/transformers/faiss passam de 2 GB
      # e nenhum teste importa o pipeline RAG.
      - name: Instalar dependencias
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-cov ruff

      - name: Erros de sintaxe e nomes indefinidos
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compilar todos os modulos
        run: python -m compileall -q api app frontend tests

      # Cobertura so de api/. app/requirements.txt nao e instalado neste job
      # (ver comentario acima: torch/faiss passam de 2 GB), entao app/ sairia
      # como 0% e o numero mentiria. A cobertura do nucleo RAG tem de ser medida
      # localmente, com o stack completo instalado.
      - name: Testes com cobertura
        run: pytest tests/ -q --cov=api --cov-report=term-missing --cov-report=xml

      # Guardado como artefato para que o numero possa ser recuperado depois,
      # por execucao, sem precisar reabrir o log do job.
      - name: Guardar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: coverage.xml
          if-no-files-found: error

  migracoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install alembic python-dotenv

      # Resolve o grafo de revisoes sem conectar no banco. Pega down_revision
      # apontando para revisao inexistente e head duplicado apos merge malfeito.
      - name: Cadeia de revisoes resolve
        working-directory: api
        env:
          DATABASE_URL: sqlite:///ci.db
        run: alembic heads

      # Sqlite nao e Postgres, mas roda o upgrade inteiro de graca e pega DDL
      # quebrado em qualquer revisao da cadeia.
      - name: Upgrade completo em banco descartavel
        working-directory: api
        env:
          DATABASE_URL: sqlite:///ci.db
        run: alembic upgrade head
