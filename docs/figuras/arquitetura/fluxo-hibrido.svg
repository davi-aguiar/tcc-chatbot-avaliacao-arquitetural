<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="176.000mm" viewBox="0 0 1200 1320" role="img" aria-labelledby="title description">
  <title id="title">Fluxo híbrido de menu e consulta documental</title>
  <desc id="description">O ChatService trata comandos, onboarding e estado da conversa. Respostas locais e navegação não usam o RAG. Uma opção de menu com consulta usa a pergunta do JSON; texto livre usa a pergunta digitada. Os dois caminhos documentais recuperam contexto no FAISS e solicitam geração externa na Groq. O backend adapta o resultado, persiste e devolve ao adaptador do canal.</desc>
