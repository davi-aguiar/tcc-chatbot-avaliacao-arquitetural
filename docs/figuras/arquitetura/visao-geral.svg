<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="106.667mm" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Visão geral da arquitetura do chatbot</title>
  <desc id="description">WhatsApp por Evolution ou Twilio interage com um backend Python. Conversa e menus, núcleo RAG e índice FAISS local pertencem ao mesmo processo. Documentos e embeddings alimentam o índice. O banco relacional registra estado e histórico; a Groq é o serviço externo de geração.</desc>
